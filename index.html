<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construction Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F8;
    --surface:#FFFFFF;
    --surface-2:#FAFBFC;
    --border:#E3E6EA;
    --border-strong:#CBD0D8;
    --ink:#171A21;
    --ink-2:#4B5160;
    --ink-3:#868C99;
    --brand:#1F4E5F;
    --brand-ink:#123340;
    --brand-soft:#E4EEF1;
    --steel:#3E6E82;

    --green:#1E8A5F;
    --green-soft:#E4F5EE;
    --amber:#B67B0E;
    --amber-soft:#FBF0DC;
    --red:#C1402F;
    --red-soft:#FBE7E3;
    --blue:#2C6CA6;
    --blue-soft:#E4EEF8;
    --gray-soft:#EEF0F3;

    --radius-s:6px;
    --radius-m:10px;
    --radius-l:14px;
    --shadow-1:0 1px 2px rgba(20,24,32,.06);
    --shadow-2:0 4px 16px rgba(20,24,32,.08);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  body.lang-th{font-family:'Noto Sans Thai','Inter',sans-serif;}
  .th{font-family:'Noto Sans Thai','Inter',sans-serif;}
  ::selection{background:var(--brand-soft);}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;}

  /* ---------- App shell ---------- */
  .app{
    display:grid;
    grid-template-columns:248px 1fr;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--brand-ink);
    color:#DDE7EA;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:20px 18px 16px;
    border-bottom:1px solid rgba(255,255,255,.09);
  }
  .brand-mark{
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(155deg,#3E6E82,#1F4E5F);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    border:1px solid rgba(255,255,255,.14);
  }
  .brand-mark svg{width:18px;height:18px;}
  .brand-name{font-size:13.5px;font-weight:700;color:#fff;line-height:1.25;}
  .brand-sub{font-size:10.5px;color:#93A7AD;letter-spacing:.02em;margin-top:1px;}

  .nav-group-label{
    font-size:10.5px;
    font-weight:600;
    color:#6F8890;
    padding:16px 18px 6px;
    letter-spacing:.03em;
    display:flex;align-items:center;gap:6px;
  }
  .ng-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .nav{padding:4px 10px 16px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:8px 10px 8px 8px;
    border-radius:8px;
    font-size:13.3px;
    font-weight:500;
    color:#B9CBCF;
    text-decoration:none;
    margin-bottom:1px;
    border:none;background:none;width:100%;text-align:left;
    border-left:3px solid transparent;
    transition:background .12s ease, color .12s ease, border-color .12s ease;
  }
  .nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
  .nav-item.active{background:#EAF1F0;color:var(--brand-ink);font-weight:600;border-left-color:var(--item-accent, var(--brand));}
  .nav-item.active svg{opacity:1;color:var(--item-accent, var(--brand-ink));}
  .nav-item .count{
    margin-left:auto;
    font-size:10.5px;
    font-weight:700;
    background:rgba(255,255,255,.12);
    color:#DDE7EA;
    padding:1px 6px;
    border-radius:20px;
  }
  .nav-item.active .count{background:var(--red);color:#fff;}

  .sidebar-foot{
    padding:12px 18px 16px;
    border-top:1px solid rgba(255,255,255,.09);
    font-size:11px;
    color:#6F8890;
    line-height:1.5;
  }

  .sidebar-scrim{display:none;}

  /* ---------- Main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;}
  .topbar{
    height:58px;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:16px;
    padding:0 22px;
    position:sticky;top:0;z-index:20;
  }
  .search{
    flex:1;max-width:420px;
    display:flex;align-items:center;gap:8px;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:7px 12px;
    color:var(--ink-3);
  }
  .search svg{width:15px;height:15px;flex-shrink:0;}
  .search input{
    border:none;background:none;outline:none;
    font-size:13px;color:var(--ink);width:100%;font-family:inherit;
  }
  .search input::placeholder{color:var(--ink-3);}
  .topbar-right{display:flex;align-items:center;gap:10px;margin-left:auto;}

  .icon-btn{
    width:34px;height:34px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:1px solid transparent;color:var(--ink-2);
    position:relative;
  }
  .icon-btn:hover{background:var(--surface-2);border-color:var(--border);}
  .icon-btn svg{width:17px;height:17px;}
  .dot-badge{
    position:absolute;top:6px;right:6px;
    width:7px;height:7px;border-radius:50%;background:var(--red);
    border:1.5px solid var(--surface);
  }

  .lang-switch{
    display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--border);
    border-radius:8px;padding:2px;gap:2px;
  }
  .lang-opt{
    border:none;background:none;font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:6px;color:var(--ink-3);
  }
  .lang-opt.sel{background:var(--surface);color:var(--brand-ink);box-shadow:var(--shadow-1);}

  .role-switch{position:relative;}
  .role-btn{
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--border);background:var(--surface);
    border-radius:8px;padding:6px 10px 6px 6px;font-size:12.5px;font-weight:600;color:var(--ink);
  }
  .role-btn:hover{border-color:var(--border-strong);}
  .role-avatar{
    width:22px;height:22px;border-radius:6px;
    background:var(--brand-soft);color:var(--brand-ink);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;
  }
  .role-btn .rlabel-mut{color:var(--ink-3);font-weight:500;}
  .role-menu{
    position:absolute;top:calc(100% + 6px);right:0;
    background:var(--surface);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-2);
    width:200px;padding:6px;display:none;z-index:30;
  }
  .role-menu.open{display:block;}
  .role-opt{
    display:flex;align-items:center;gap:9px;width:100%;
    padding:8px 9px;border-radius:7px;border:none;background:none;
    font-size:12.8px;font-weight:500;text-align:left;color:var(--ink-2);
  }
  .role-opt:hover{background:var(--surface-2);}
  .role-opt.sel{background:var(--brand-soft);color:var(--brand-ink);font-weight:700;}
  .role-opt .role-avatar{width:20px;height:20px;font-size:9px;}

  .notif-panel{
    position:absolute;top:calc(100% + 6px);right:0;
    width:340px;background:var(--surface);border:1px solid var(--border);
    border-radius:10px;box-shadow:var(--shadow-2);display:none;z-index:30;
    max-height:420px;overflow-y:auto;
  }
  .notif-panel.open{display:block;}
  .notif-head{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:700;}
  .notif-item{
    display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);
    text-align:left;width:100%;border:none;background:none;
  }
  .notif-item:last-child{border-bottom:none;}
  .notif-item:hover{background:var(--surface-2);}
  .notif-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .notif-text{font-size:12.5px;color:var(--ink);line-height:1.45;}
  .notif-time{font-size:11px;color:var(--ink-3);margin-top:2px;}

  .content{padding:24px 28px 60px;flex:1;min-width:0;}
  .content-inner{max-width:1180px;}

  /* ---------- Page header ---------- */
  .page-head{margin-bottom:20px;}
  .crumb{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.02em;margin-bottom:4px;}
  .page-title{font-size:21px;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
  .page-sub{font-size:13px;color:var(--ink-2);margin-top:4px;max-width:640px;line-height:1.5;}

  .project-strip{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-m);padding:14px 18px;margin-bottom:20px;
  }
  .project-strip h1{font-size:16.5px;font-weight:800;margin:0;}
  .project-strip .proj-meta{font-size:12px;color:var(--ink-3);margin-top:2px;}
  .status-pill{
    margin-left:auto;display:flex;align-items:center;gap:6px;
    background:var(--green-soft);color:var(--green);
    font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;
  }
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:14px;}
  .grid > *{min-width:0;}
  .card{overflow:hidden;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-m);padding:16px;
  }
  .stat-card{padding:15px 16px;}
  .stat-label{font-size:11.5px;color:var(--ink-3);font-weight:600;display:flex;align-items:center;justify-content:space-between;}
  .stat-value{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px;color:var(--ink);}
  .stat-delta{font-size:11.5px;font-weight:600;margin-top:5px;display:flex;align-items:center;gap:4px;}
  .stat-delta.up{color:var(--red);}
  .stat-delta.good{color:var(--green);}
  .stat-delta.flat{color:var(--ink-3);}
  .stat-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
  .stat-icon svg{width:14px;height:14px;}

  .bar-track{height:6px;background:var(--gray-soft);border-radius:6px;margin-top:10px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:6px;}

  .section{margin-bottom:26px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .section-title{font-size:15px;font-weight:800;}
  .section-link{font-size:12px;font-weight:600;color:var(--brand);background:none;border:none;}
  .section-link:hover{text-decoration:underline;}

  /* ---------- Table ---------- */
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{
    text-align:left;font-size:11px;font-weight:700;color:var(--ink-3);
    text-transform:none;padding:10px 14px;background:var(--surface-2);
    border-bottom:1px solid var(--border);letter-spacing:.01em;
  }
  tbody td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--ink-2);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .1s ease;}
  tbody tr.clickable:hover{background:var(--surface-2);cursor:pointer;}
  td.strong{color:var(--ink);font-weight:600;}

  /* ---------- Badges ---------- */
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
    white-space:nowrap;
  }
  .badge .dot{width:5px;height:5px;border-radius:50%;}
  .badge-green{background:var(--green-soft);color:var(--green);}
  .badge-amber{background:var(--amber-soft);color:var(--amber);}
  .badge-red{background:var(--red-soft);color:var(--red);}
  .badge-blue{background:var(--blue-soft);color:var(--blue);}
  .badge-gray{background:var(--gray-soft);color:var(--ink-2);}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:700;padding:8px 14px;
    border-radius:8px;border:1px solid var(--border-strong);
    background:var(--surface);color:var(--ink);
  }
  .btn:hover{background:var(--surface-2);}
  .btn svg{width:14px;height:14px;}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  .btn-primary:hover{background:var(--brand-ink);}
  .btn-green{background:var(--green);border-color:var(--green);color:#fff;}
  .btn-green:hover{filter:brightness(.94);}
  .btn-red-outline{background:var(--surface);border-color:var(--red);color:var(--red);}
  .btn-red-outline:hover{background:var(--red-soft);}
  .btn-sm{padding:6px 10px;font-size:11.8px;}
  .btn-ghost{border-color:transparent;background:none;}
  .btn-ghost:hover{background:var(--surface-2);}

  /* ---------- Today list ---------- */
  .today-row{
    display:grid;grid-template-columns:1.6fr 1fr 1.2fr .9fr 1fr;gap:10px;
    padding:13px 16px;align-items:center;
  }
  .today-row + .today-row{border-top:1px solid var(--border);}
  .today-task{font-weight:700;font-size:13px;color:var(--ink);}
  .today-meta{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
  .mini-progress{display:flex;align-items:center;gap:8px;}
  .mini-progress .bar-track{flex:1;margin:0;}
  .mini-progress span{font-size:12px;font-weight:700;width:32px;text-align:right;}
  @media (max-width:900px){.today-row{grid-template-columns:1fr;gap:6px;}}

  /* ---------- Command cards ---------- */
  .cmd-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-m);padding:16px;margin-bottom:10px;
    display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;
  }
  .cmd-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-1);cursor:pointer;}
  .cmd-id{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-3);font-weight:500;}
  .cmd-subject{font-size:14.5px;font-weight:700;margin-top:3px;}
  .cmd-meta{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap;}
  .cmd-meta div{font-size:11.5px;color:var(--ink-3);}
  .cmd-meta b{color:var(--ink-2);font-weight:600;}

  /* ---------- Detail layout ---------- */
  .back-link{
    display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;
    color:var(--ink-2);background:none;border:none;margin-bottom:14px;
  }
  .back-link:hover{color:var(--brand);}
  .back-link svg{width:14px;height:14px;}
  .detail-grid{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start;}
  @media (max-width:920px){.detail-grid{grid-template-columns:1fr;}}
  .info-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.8px;}
  .info-row:last-child{border-bottom:none;}
  .info-row .k{color:var(--ink-3);}
  .info-row .v{color:var(--ink);font-weight:600;text-align:right;}

  .task-row{display:grid;grid-template-columns:28px 1.6fr 1fr auto;gap:10px;align-items:center;padding:11px 14px;}
  .task-row + .task-row{border-top:1px solid var(--border);}
  .task-num{
    width:22px;height:22px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--ink-3);
  }
  .task-name{font-size:12.8px;font-weight:600;color:var(--ink);}

  /* ---------- Impact map ---------- */
  .impact-wrap{display:grid;grid-template-columns:1fr 280px;gap:18px;}
  @media (max-width:920px){.impact-wrap{grid-template-columns:1fr;}}
  .flow-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:22px 20px;}
  .flow-node{
    display:flex;align-items:center;gap:12px;padding:13px 15px;
    border:1px solid var(--border);border-radius:var(--radius-s);background:var(--surface-2);
    position:relative;
  }
  .flow-node.origin{background:var(--brand-soft);border-color:var(--steel);}
  .flow-node .fn-num{
    width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--border-strong);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink-2);flex-shrink:0;
  }
  .flow-node.done .fn-num{background:var(--green);border-color:var(--green);color:#fff;}
  .flow-node.active .fn-num{background:var(--blue);border-color:var(--blue);color:#fff;}
  .flow-node .fn-name{font-size:13px;font-weight:700;flex:1;}
  .flow-node .fn-pct{font-size:12px;font-weight:700;color:var(--ink-3);}
  .flow-connector{
    width:2px;height:22px;background:var(--border-strong);margin-left:26px;
  }
  .impact-stat{padding:13px 0;border-bottom:1px solid var(--border);}
  .impact-stat:last-child{border-bottom:none;}
  .impact-stat .il{font-size:11px;color:var(--ink-3);font-weight:600;}
  .impact-stat .iv{font-size:19px;font-weight:800;margin-top:3px;}
  .impact-stat .iv.red{color:var(--red);}
  .impact-stat .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .tag{font-size:11px;background:var(--gray-soft);color:var(--ink-2);padding:3px 8px;border-radius:6px;font-weight:600;}

  /* ---------- Progress compare ---------- */
  .compare-bars{display:flex;flex-direction:column;gap:14px;}
  .cbar-row .cbar-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
  .cbar-row .cbar-top b{font-weight:700;color:var(--ink);}
  .cbar-track{height:10px;background:var(--gray-soft);border-radius:6px;overflow:hidden;}
  .cbar-fill{height:100%;border-radius:6px;}

  .alert{
    display:flex;gap:12px;padding:14px 16px;border-radius:var(--radius-m);border:1px solid;
    align-items:flex-start;
  }
  .alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;}
  .alert-amber{background:var(--amber-soft);border-color:#EBD19E;color:#8A5D08;}
  .alert-red{background:var(--red-soft);border-color:#E9B6AC;color:#8F2C1F;}
  .alert-blue{background:var(--blue-soft);border-color:#B7D0E8;color:#1E4E77;}
  .alert-title{font-weight:700;font-size:12.8px;}
  .alert-body{font-size:12.3px;margin-top:2px;line-height:1.5;opacity:.92;}
  .alert-actions{margin-top:9px;display:flex;gap:8px;}

  /* ---------- Verification queue ---------- */
  .verify-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;margin-bottom:12px;}
  .verify-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .verify-name{font-size:13.5px;font-weight:700;}
  .verify-loc{font-size:11.8px;color:var(--ink-3);margin-top:2px;}
  .verify-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
  .verify-col{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .verify-col .vl{font-size:10.5px;color:var(--ink-3);font-weight:700;}
  .verify-col .vv{font-size:19px;font-weight:800;margin-top:3px;}
  .verify-actions{display:flex;gap:8px;}
  @media (max-width:700px){.verify-cols{grid-template-columns:1fr;}}

  /* ---------- Evidence ---------- */
  .ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media (max-width:900px){.ev-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.ev-grid{grid-template-columns:1fr;}}
  .ev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;cursor:pointer;}
  .ev-card:hover{border-color:var(--border-strong);}
  .ev-thumb{
    height:120px;background:linear-gradient(135deg,#D9E4E8,#C3D3D8);
    display:flex;align-items:center;justify-content:center;color:#6F8890;position:relative;
  }
  .ev-thumb svg{width:28px;height:28px;}
  .ev-flag{position:absolute;top:8px;right:8px;}
  .ev-body{padding:11px 13px;}
  .ev-id{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-3);}
  .ev-task{font-size:12.5px;font-weight:700;margin-top:3px;}
  .ev-foot{font-size:11px;color:var(--ink-3);margin-top:7px;}

  .ai-box{
    background:var(--surface-2);border:1px dashed var(--border-strong);border-radius:var(--radius-m);
    padding:16px;margin-top:16px;
  }
  .ai-box-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .ai-box-head .ai-chip{
    display:flex;align-items:center;gap:5px;background:var(--brand-soft);color:var(--brand-ink);
    font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;
  }
  .ai-box-head .ai-chip svg{width:12px;height:12px;}
  .ai-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:10px;}
  .ai-metric .al{font-size:10.5px;color:var(--ink-3);font-weight:700;}
  .ai-metric .av{font-size:20px;font-weight:800;margin-top:2px;}

  /* ---------- Action Required ---------- */
  .action-item{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--border);border-left:4px solid;
    border-radius:var(--radius-m);padding:14px 16px;margin-bottom:10px;
  }
  .action-item.crit{border-left-color:var(--red);}
  .action-item.att{border-left-color:var(--amber);}
  .action-item.fyi{border-left-color:var(--blue);}
  .action-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .action-icon svg{width:15px;height:15px;}
  .action-text{font-size:13px;font-weight:700;}
  .action-meta{display:flex;gap:14px;margin-top:7px;flex-wrap:wrap;}
  .action-meta div{font-size:11.5px;color:var(--ink-3);}
  .action-meta b{color:var(--ink-2);font-weight:600;}
  .action-right{margin-left:auto;flex-shrink:0;}

  /* ---------- Insight ---------- */
  .insight-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px;margin-bottom:12px;}
  .insight-top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .insight-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .insight-icon svg{width:15px;height:15px;}
  .insight-type{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-3);}
  .insight-title{font-size:13.8px;font-weight:700;}
  .insight-body{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-bottom:10px;}
  .insight-facts{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:10px;}
  .insight-facts .fl{font-size:10.5px;color:var(--ink-3);font-weight:700;}
  .insight-facts .fv{font-size:13.5px;font-weight:700;margin-top:2px;}

  /* ---------- Documents ---------- */
  .doc-cat{margin-bottom:22px;}
  .doc-cat-title{font-size:12.5px;font-weight:800;color:var(--ink-2);margin-bottom:8px;display:flex;align-items:center;gap:7px;}
  .doc-cat-title .n{font-weight:600;color:var(--ink-3);}
  .doc-row{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-s);padding:11px 14px;margin-bottom:6px;
  }
  .doc-row:hover{border-color:var(--border-strong);}
  .doc-icon{width:30px;height:30px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .doc-icon svg{width:14px;height:14px;color:var(--ink-3);}
  .doc-name{font-size:12.8px;font-weight:700;}
  .doc-meta{font-size:11px;color:var(--ink-3);margin-top:2px;}
  .doc-link{font-size:11px;color:var(--brand);font-weight:700;margin-left:auto;white-space:nowrap;}

  /* ---------- Data conflict ---------- */
  .conflict-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-m);padding:18px;margin-bottom:16px;}
  .conflict-vals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0;}
  @media (max-width:800px){.conflict-vals{grid-template-columns:repeat(2,1fr);}}
  .conflict-cell{border:1px solid var(--border);border-radius:8px;padding:11px 12px;text-align:center;}
  .conflict-cell.truth{background:var(--brand-soft);border-color:var(--steel);}
  .conflict-cell .cl{font-size:10px;color:var(--ink-3);font-weight:700;}
  .conflict-cell .cv{font-size:20px;font-weight:800;margin-top:4px;}

  /* ---------- About ---------- */
  .about-hero{background:var(--brand-ink);color:#fff;border-radius:var(--radius-l);padding:32px;margin-bottom:20px;position:relative;overflow:hidden;}
  .about-hero::after{
    content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);
  }
  .about-eyebrow{font-size:12px;font-weight:700;color:#9FC1C9;}
  .about-title{font-size:24px;font-weight:800;margin-top:6px;max-width:560px;line-height:1.3;}
  .about-flow{font-size:13px;color:#C7DADE;margin-top:14px;font-family:'JetBrains Mono',monospace;}
  .about-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:800px){.about-cols{grid-template-columns:1fr;}}
  .problem-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.8px;color:var(--ink-2);}
  .problem-item:last-child{border-bottom:none;}
  .problem-item b{color:var(--red);font-weight:800;flex-shrink:0;}
  .credit-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px 18px;margin-top:6px;}
  .credit-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;color:var(--ink-2);}
  .credit-row b{color:var(--ink);font-weight:700;}

  .role-perm-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px;}
  @media (max-width:1050px){.role-perm-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.role-perm-grid{grid-template-columns:1fr;}}
  .perm-card{border:1px solid var(--border);border-radius:var(--radius-m);padding:14px;}
  .perm-card h4{margin:0 0 8px;font-size:12.5px;font-weight:800;}
  .perm-card ul{margin:0;padding-left:16px;font-size:11.8px;color:var(--ink-2);line-height:1.8;}

  /* ---------- Mobile ---------- */
  @media (max-width:880px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:248px;z-index:100;transform:translateX(-100%);transition:transform .2s ease;}
    .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-2);}
    .sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(10,14,18,.4);z-index:90;}
    .sidebar-scrim.open{display:block;}
    .content{padding:16px 14px 90px;}
    .grid-4,.grid-3,.grid-2{grid-template-columns:repeat(2,1fr);}
    .project-strip{flex-wrap:wrap;}
    .status-pill{margin-left:0;}
    .topbar{padding:0 12px;gap:8px;}
    .search{max-width:none;}
    .role-btn .rlabel-mut{display:none;}
  }
  @media (max-width:560px){
    .grid-3,.grid-2{grid-template-columns:1fr;}
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .stat-value{font-size:22px;}
    .verify-cols{grid-template-columns:1fr;}
    .ev-grid{grid-template-columns:1fr;}
    .role-btn span:not(.role-avatar){display:none;}
  }

  .kbd-hint{font-size:10.5px;color:var(--ink-3);border:1px solid var(--border);padding:1px 6px;border-radius:5px;font-family:'JetBrains Mono',monospace;}

  .search-results{
    position:absolute;top:calc(100% + 6px);left:0;right:0;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow-2);max-height:340px;overflow-y:auto;display:none;z-index:30;
  }
  .search-results.open{display:block;}
  .sr-item{display:flex;flex-direction:column;padding:10px 14px;border-bottom:1px solid var(--border);}
  .sr-item:last-child{border-bottom:none;}
  .sr-item:hover{background:var(--surface-2);cursor:pointer;}
  .sr-item .sr-title{font-size:12.5px;font-weight:700;}
  .sr-item .sr-sub{font-size:11px;color:var(--ink-3);margin-top:2px;}

  /* ---------- Login ---------- */
  .login-screen{
    position:fixed;inset:0;z-index:200;
    background:linear-gradient(160deg,#0F2933,#123340 55%,#1F4E5F);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .login-card{
    background:var(--surface);border-radius:16px;
    width:100%;max-width:380px;padding:28px 26px 24px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .login-title{font-size:15px;font-weight:800;color:var(--ink);line-height:1.3;}
  .login-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
  .google-btn{
    width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    border:1px solid var(--border-strong);background:var(--surface);
    border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;color:var(--ink);
  }
  .google-btn:hover{background:var(--surface-2);}
  .login-divider{
    display:flex;align-items:center;gap:10px;margin:16px 0;
    font-size:11px;color:var(--ink-3);font-weight:600;
  }
  .login-divider::before,.login-divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .login-field{margin-bottom:12px;}
  .login-field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);margin-bottom:5px;}
  .login-field input, .login-field select{
    width:100%;border:1px solid var(--border-strong);border-radius:8px;
    padding:9px 11px;font-size:13px;font-family:inherit;color:var(--ink);background:var(--surface);
  }
  .login-field input:focus, .login-field select:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand);}
  .login-note{font-size:11px;color:var(--ink-3);margin-top:12px;line-height:1.5;text-align:center;}
  .chooser-item{
    display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:8px;
    background:var(--surface);
  }
  .chooser-item:hover{background:var(--surface-2);border-color:var(--border-strong);}
  .chooser-avatar{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;
  }
  .chooser-name{font-size:12.8px;font-weight:700;color:var(--ink);}
  .chooser-email{font-size:11px;color:var(--ink-3);margin-top:1px;}

  .profile-header{padding:10px 10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .profile-header .pname{font-size:12.8px;font-weight:700;color:var(--ink);}
  .profile-header .pemail{font-size:11px;color:var(--ink-3);margin-top:1px;}
  .role-menu-label{font-size:10.5px;font-weight:700;color:var(--ink-3);padding:6px 9px 4px;letter-spacing:.02em;}
  .signout-opt{color:var(--red) !important;}

  .queue-card{
    background:linear-gradient(180deg,var(--brand-soft),var(--surface) 55%);
    border:1px solid var(--steel);border-radius:var(--radius-m);
    padding:16px 18px;margin-bottom:22px;
  }
  .queue-head{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
  .queue-head .qtitle{font-size:14.5px;font-weight:800;color:var(--brand-ink);}
  .queue-sub{font-size:12px;color:var(--ink-2);margin-bottom:12px;}
  .queue-empty{font-size:12.8px;color:var(--ink-2);padding:8px 2px;}
  .queue-item{
    display:flex;gap:11px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--border);border-radius:9px;
    padding:11px 13px;margin-bottom:8px;
  }
  .queue-item:last-child{margin-bottom:0;}
  .queue-item:hover{border-color:var(--border-strong);cursor:pointer;}
  .queue-item .qtext{font-size:12.8px;font-weight:700;color:var(--ink);flex:1;}
  .age-pill{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
  .age-red{background:var(--red-soft);color:var(--red);}
  .age-amber{background:var(--amber-soft);color:var(--amber);}

  /* ---------- Dashboard zones ---------- */
  .zone-box{
    border-radius:var(--radius-l);
    padding:18px 18px 4px;
    margin-bottom:22px;
    background: color-mix(in srgb, var(--zone-color) 5%, var(--surface));
    border:1px solid color-mix(in srgb, var(--zone-color) 22%, var(--border));
  }
  .zone-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .zone-dot{width:9px;height:9px;border-radius:3px;background:var(--zone-color);flex-shrink:0;}
  .zone-title{font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--zone-color);}
  .zone-box .card{border-color:color-mix(in srgb, var(--zone-color) 14%, var(--border));}

  @media print{
    .sidebar, .topbar, .btn, .section-link, .back-link, .sidebar-scrim{display:none !important;}
    .app{display:block;}
    .content{padding:0;}
    body{background:#fff;}
    .card, .table-wrap, .cmd-card, .conflict-card, .verify-card, .insight-card{break-inside:avoid;}
  }
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark" style="width:44px;height:44px;border-radius:11px">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="login-title">Construction Command Center</div>
        <div class="login-sub" id="loginTagline"></div>
      </div>
    </div>

    <div id="loginBody">
      <button class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.5 6 29.5 4 24 4c-7.5 0-14 4.2-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.3 35.4 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.9 39.7 16.4 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.3 5.3C40.9 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        <span id="googleBtnLabel">Continue with Google</span>
      </button>

      <div class="login-divider"><span id="loginOrLabel">or</span></div>

      <div class="login-field">
        <label id="lblName">Full name</label>
        <input type="text" id="loginName" placeholder="Veera Wongson">
      </div>
      <div class="login-field">
        <label id="lblEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@company.com">
      </div>
      <div class="login-field">
        <label id="lblRole">Sign in as</label>
        <select id="loginRole">
          <option value="owner">Owner</option>
          <option value="consultant" selected>Consultant</option>
          <option value="contractor">Contractor</option>
          <option value="designer">Designer</option>
        </select>
      </div>
      <button class="btn btn-primary" id="emailSignInBtn" style="width:100%;justify-content:center;margin-top:4px">Sign In</button>
      <div class="login-note" id="loginNote"></div>
    </div>

    <div id="chooserBody" style="display:none">
      <div class="login-note" style="margin-bottom:10px" id="chooserTitle">Choose an account</div>
      <div id="chooserList"></div>
      <button class="back-link" id="chooserBack" style="margin-top:10px;margin-bottom:0">← Back</button>
    </div>
  </div>
</div>

<div class="app" id="appRoot" style="display:none">


  <div class="sidebar-scrim" id="scrim" onclick="toggleSidebar(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 11h.01M15 11h.01M9 15h.01M15 15h.01" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <div class="brand-name">Command Center</div>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>

    <div class="nav" id="navList"></div>

    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" style="display:none" id="hamburger" onclick="toggleSidebar(true)">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="search" style="position:relative">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="text" oninput="onSearch(this.value)" onfocus="onSearch(this.value)">
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="topbar-right">
        <div class="lang-switch" id="langSwitch">
          <button class="lang-opt" data-lang="th">ไทย</button>
          <button class="lang-opt" data-lang="en">EN</button>
        </div>

        <div style="position:relative">
          <button class="icon-btn" onclick="togglePanel('notif')">
            <svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.7 21a2 2 0 01-3.4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span class="dot-badge"></span>
          </button>
          <div class="notif-panel" id="panel-notif">
            <div class="notif-head" id="notifHead"></div>
            <div id="notifList"></div>
          </div>
        </div>

        <div class="role-switch">
          <button class="role-btn" onclick="togglePanel('role')">
            <span class="role-avatar" id="roleAvatar">C</span>
            <span id="roleBtnLabel"></span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="role-menu" id="panel-role" style="width:230px"></div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="content-inner" id="view"></div>
    </main>
  </div>
</div>

<script>
/* ============================= I18N ============================= */

let currentLang = "en"; // "en" | "th"

const STR = {
  searchPlaceholder:{en:"Search commands, tasks, rooms, documents…", th:"ค้นหาคำสั่ง งาน ห้อง เอกสาร…"},
  noResultsFor:{en:'No results for', th:'ไม่พบผลลัพธ์สำหรับ'},
  notifications:{en:"Notifications", th:"การแจ้งเตือน"},
  viewingAs:{en:"Viewing as:", th:"มุมมอง:"},
  brandSub:{en:"Construction Ops", th:"งานก่อสร้าง"},
  sidebarFoot:{en:"High-Rise Building<br>Construction Project", th:"โครงการก่อสร้าง<br>อาคารสูง"},

  // roles
  role_owner:{en:"Owner", th:"เจ้าของโครงการ"},
  role_consultant:{en:"Consultant", th:"ที่ปรึกษา"},
  role_contractor:{en:"Contractor", th:"ผู้รับเหมา"},
  role_designer:{en:"Designer", th:"ผู้ออกแบบ"},

  // nav groups
  ng_overview:{en:"Overview", th:"ภาพรวม"},
  ng_commands:{en:"Commands", th:"คำสั่งงาน"},
  ng_progress:{en:"Progress", th:"ความคืบหน้า"},
  ng_evidence:{en:"Evidence & Risk", th:"หลักฐาน & ความเสี่ยง"},
  ng_reference:{en:"Reference", th:"เอกสารอ้างอิง"},

  // nav items

  core_concept_quote:{en:'"Turning construction commands from paper into work that can be tracked all the way to real results."', th:'“เปลี่ยนคำสั่งก่อสร้างจากเอกสาร ให้กลายเป็นงานที่ติดตามได้จนถึงผลลัพธ์จริง”'},
  core_concept_body:{en:"Construction information today is scattered — official letters, PDFs, spreadsheets, schedules, daily reports, chat messages, site photos, contractor reports and consultant reports all live in different places. CCC brings them into a single source of truth, and — critically — connects every Owner command to the actual tasks, evidence and schedule impact it creates.", th:"ข้อมูลงานก่อสร้างในปัจจุบันกระจัดกระจายอยู่หลายแหล่ง ทั้งหนังสือราชการ PDF Excel ตารางงาน รายงานประจำวัน ข้อความแชท รูปภาพหน้างาน รายงานผู้รับเหมา และรายงานที่ปรึกษา CCC รวบรวมข้อมูลเหล่านี้ให้เป็นแหล่งข้อมูลเดียว และที่สำคัญคือเชื่อมโยงคำสั่งงานทุกรายการของเจ้าของโครงการเข้ากับงานจริง หลักฐาน และผลกระทบต่อแผนงานที่เกิดขึ้น"},

function t(key){
  const e = STR[key];
  if(!e) return key;
  return e[currentLang] || e.en;
}
function tl(key){ // returns array for current lang
  const e = STR[key];
  if(!e) return [];
  return e[currentLang] || e.en;
}
function pick(obj){ // obj like {en:"...", th:"..."}
  if(obj==null) return "";
  if(typeof obj === "string") return obj;
  return obj[currentLang] || obj.en;
}

/* ---------- S-Curve chart (SVG) ---------- */
// Cumulative % by week — classic S-curve shape (slow start, steep middle, tapering finish)
const SCURVE_WEEKS = 12;
const SCURVE_PLANNED   = [2,6,13,24,38,52,65,76,85,92,97,100];
const SCURVE_CONTRACTOR= [2,7,15,27,41,55,68,79,86,90,null,null];
const SCURVE_VERIFIED  = [1,5,11,21,33,45,57,66,74,null,null,null];

function buildSCurvePath(values, w, h, padL, padT, innerW, innerH){
  const pts = [];
  values.forEach((v,i)=>{
    if(v==null) return;
    pts.push([padL + (i/(SCURVE_WEEKS-1))*innerW, padT + innerH - (v/100)*innerH]);
  });
  if(pts.length===0) return {d:"", last:null};
  if(pts.length===1) return {d:`M ${pts[0][0]} ${pts[0][1]}`, last:pts[0]};
  // monotone cubic (Fritsch-Carlson) => smooth S shape without wiggles
  const n = pts.length, dx=[], m=[], tan=new Array(n);
  for(let i=0;i<n-1;i++){ dx[i]=pts[i+1][0]-pts[i][0]; m[i]=(pts[i+1][1]-pts[i][1])/dx[i]; }
  tan[0]=m[0]; tan[n-1]=m[n-2];
  for(let i=1;i<n-1;i++){ tan[i] = (m[i-1]*m[i] <= 0) ? 0 : (m[i-1]+m[i])/2; }
  for(let i=0;i<n-1;i++){
    if(m[i]===0){ tan[i]=0; tan[i+1]=0; continue; }
    const a=tan[i]/m[i], b=tan[i+1]/m[i], sq=a*a+b*b;
    if(sq>9){ const k=3/Math.sqrt(sq); tan[i]=k*a*m[i]; tan[i+1]=k*b*m[i]; }
  }
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for(let i=0;i<n-1;i++){
    const h3 = dx[i]/3;
    d += ` C ${pts[i][0]+h3} ${pts[i][1]+tan[i]*h3}, ${pts[i+1][0]-h3} ${pts[i+1][1]-tan[i+1]*h3}, ${pts[i+1][0]} ${pts[i+1][1]}`;
  }
  return {d, last:pts[n-1]};
}

function renderSCurveSVG(){
  const w=640, h=280, padL=46, padT=14, padB=34, padR=16;
  const innerW = w-padL-padR, innerH = h-padT-padB;
  const planned = buildSCurvePath(SCURVE_PLANNED, w,h,padL,padT,innerW,innerH);
  const contractor = buildSCurvePath(SCURVE_CONTRACTOR, w,h,padL,padT,innerW,innerH);
  const verified = buildSCurvePath(SCURVE_VERIFIED, w,h,padL,padT,innerW,innerH);

  let gridLines = "";
  [0,25,50,75,100].forEach(v=>{
    const y = padT + innerH - (v/100)*innerH;
    gridLines += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
    gridLines += `<text x="${padL-8}" y="${y+3}" font-size="13" fill="var(--ink-3)" text-anchor="end" font-family="Inter">${v}%</text>`;
  });
  let weekLabels = "";
  for(let i=0;i<SCURVE_WEEKS;i+=2){
    const x = padL + (i/(SCURVE_WEEKS-1))*innerW;
    weekLabels += `<text x="${x}" y="${h-10}" font-size="13" fill="var(--ink-3)" text-anchor="middle" font-family="Inter">${(currentLang==='th'?'สัปดาห์':'Wk')} ${i+1}</text>`;
  }
  function dot(pt,color){ return pt? `<circle cx="${pt[0]}" cy="${pt[1]}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/>` : ""; }

  return `
  <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    ${gridLines}
    ${weekLabels}
    <path d="${planned.d}" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="5,4"/>
    <path d="${verified.d}" fill="none" stroke="var(--green)" stroke-width="2.5"/>
    <path d="${contractor.d}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>
    ${dot(planned.last,'var(--ink-3)')}
    ${dot(verified.last,'var(--green)')}
    ${dot(contractor.last,'var(--blue)')}
  </svg>`;
}

    <div style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)"><span style="width:16px;height:2px;background:var(--ink-3);display:inline-block;border-top:2px dashed var(--ink-3)"></span>${t('scurve_planned')}</div>

/* ---------- 3D Progress Model (isometric-style SVG building) ---------- */
const D3_FLOORS = 6;
// stage numbering: 0=nothing, 1=foundation, then per floor i (1..6): struct=2+3*(i-1), wallActive=struct+1, wallDone=struct+2, then roof=last+1
function d3StageNums(i){ const struct=2+3*(i-1); return {struct, wallActive:struct+1, wallDone:struct+2}; }
const D3_MAX_STAGE = d3StageNums(D3_FLOORS).wallDone + 1; // + roof

function d3FloorState(floorIdx, N){
  const {struct, wallActive, wallDone} = d3StageNums(floorIdx);
  if(N < struct) return {structure:'pending', wall:'pending'};
  if(N === struct) return {structure:'done', wall:'pending'};
  if(N === wallActive) return {structure:'done', wall:'active'};
  return {structure:'done', wall:'done'}; // N >= wallDone
}
function d3CurrentLabel(N){
  if(N<=0) return t('d3_stage_site');
  if(N===1) return t('d3_stage_foundation');
  if(N===D3_MAX_STAGE) return t('d3_stage_roof');
  for(let i=1;i<=D3_FLOORS;i++){
    const {struct, wallActive, wallDone} = d3StageNums(i);
    if(N===struct) return `${t('d3_stage_structure')} — ${t('d3_floor')} ${i}`;
    if(N===wallActive) return `${t('d3_stage_wall_active')} — ${t('d3_floor')} ${i}`;
    if(N===wallDone) return `${t('d3_stage_wall_done')} — ${t('d3_floor')} ${i}`;
  }
  return "";
}
function d3Colors(){
  return { done:"#9AA6AD", doneWall:"#E7E2D8", active:"#C1402F", pendingStroke:"#CBD0D8" };
}
function renderBuildingSVG(N, compact){
  const C = d3Colors();
  const floorH = compact? 22 : 34, floorGap = compact? 3 : 5, floorW = compact? 130 : 200;
  const colW = compact? 6 : 10;
  const baseX = 40, topPad = compact? 10 : 16;
  const roofH = compact? 12 : 18, foundH = compact? 10 : 16;
  const totalH = topPad + roofH + D3_FLOORS*(floorH+floorGap) + foundH + 20;
  const svgW = floorW + baseX*2;

  let y = topPad + roofH;
  let floorsSVG = "";
  // draw top floor first visually (floor 6 at top), so loop from D3_FLOORS down to 1
  for(let i=D3_FLOORS;i>=1;i--){
    const st = d3FloorState(i, N);
    const wallFill = st.wall==='pending' ? 'transparent' : st.wall==='active' ? C.active : C.doneWall;
    const wallStroke = st.wall==='pending' ? C.pendingStroke : 'none';
    const structFill = st.structure==='pending' ? 'transparent' : C.done;
    const structStroke = st.structure==='pending' ? C.pendingStroke : 'none';
    const fx = baseX;
    floorsSVG += `
      <g>
        <rect x="${fx}" y="${y}" width="${floorW}" height="${floorH}" fill="${wallFill}" stroke="${wallStroke}" stroke-width="1" stroke-dasharray="${st.wall==='pending'?'3,3':'0'}"/>
        <rect x="${fx}" y="${y}" width="${colW}" height="${floorH}" fill="${structFill}" stroke="${structStroke}" stroke-dasharray="${st.structure==='pending'?'3,3':'0'}"/>
        <rect x="${fx+floorW-colW}" y="${y}" width="${colW}" height="${floorH}" fill="${structFill}" stroke="${structStroke}" stroke-dasharray="${st.structure==='pending'?'3,3':'0'}"/>
        <rect x="${fx}" y="${y+floorH-4}" width="${floorW}" height="4" fill="${structFill}" stroke="${structStroke}"/>
        ${!compact?`<text x="${fx-8}" y="${y+floorH/2+3}" font-size="9" fill="var(--ink-3)" text-anchor="end" font-family="Inter">${i}</text>`:""}
      </g>`;
    y += floorH + floorGap;
  }
  const roofDone = N >= D3_MAX_STAGE;
  const roofY = topPad;
  const roofFill = roofDone ? C.done : 'transparent';
  const roofStroke = roofDone ? 'none' : C.pendingStroke;
  const foundFill = N>=1 ? C.done : 'transparent';
  const foundStroke = N>=1 ? 'none' : C.pendingStroke;

  return `
  <div style="display:flex;justify-content:center;overflow:hidden;width:100%">
    <div style="width:100%;transform:perspective(900px) rotateX(6deg) rotateY(-12deg);transform-style:preserve-3d">
      <svg viewBox="0 0 ${svgW} ${totalH}" style="width:100%;max-width:${compact?220:340}px;height:auto;display:block;margin:0 auto">
        <polygon points="${baseX-10},${roofY} ${baseX+floorW/2},${roofY-roofH} ${baseX+floorW+10},${roofY}" fill="${roofFill}" stroke="${roofStroke}" stroke-dasharray="${roofDone?'0':'3,3'}"/>
        ${floorsSVG}
        <rect x="${baseX-6}" y="${y}" width="${floorW+12}" height="${foundH}" fill="${foundFill}" stroke="${foundStroke}" stroke-dasharray="${N>=1?'0':'3,3'}"/>
      </svg>
    </div>
  </div>`;
}

function buildSearchIndex(){

  COMMANDS.forEach(c=> idx.push({title:c.id+" — "+pick(c.subject), sub:(currentLang==='th'?'คำสั่งงาน · ':'Command · ')+pick(c.area), go:()=>navigate('commandDetail', c.id)}));

  TODAY.forEach(tk=> idx.push({title:pick(tk.task), sub:(currentLang==='th'?'งาน · ':'Task · ')+tk.contractor, go:()=>navigate('progress')}));
  idx.push({title:"A-101", sub:(currentLang==='th'?'ห้อง · อาคาร A':'Room · Building A'), go:()=>navigate('commandDetail','COMMAND-024')});
  return idx;
}
function onSearch(q){
  const box = document.getElementById("searchResults");
  if(!q || q.trim().length<1){ box.classList.remove("open"); box.innerHTML=""; return; }
  const idx = buildSearchIndex();
  const results = idx.filter(i => (i.title+" "+i.sub).toLowerCase().includes(q.toLowerCase())).slice(0,8);
  box.innerHTML = "";
  if(results.length===0){
    box.appendChild(el(`<div class="sr-item"><div class="sr-sub">${t('noResultsFor')} "${q}"</div></div>`));
  } else {
    results.forEach(r=>{
      const item = el(`<div class="sr-item"><div class="sr-title">${r.title}</div><div class="sr-sub">${r.sub}</div></div>`);
      item.onclick = ()=>{ r.go(); box.classList.remove("open"); document.getElementById("searchInput").value=""; };
      box.appendChild(item);
    });
  }
  box.classList.add("open");
}

/* ---------- Language switch ---------- */
function setLang(lang){
  currentLang = lang;
  document.body.classList.toggle("lang-th", lang==="th");
  document.getElementById("searchInput").placeholder = t("searchPlaceholder");
  document.getElementById("brandSub").textContent = t("brandSub");
  document.getElementById("sidebarFoot").innerHTML = t("sidebarFoot");
  document.querySelectorAll(".lang-opt").forEach(b=> b.classList.toggle("sel", b.dataset.lang===lang));
  renderNav();
  renderRoleMenu();
  updateRoleUI();
  renderNotifs();
  navigate(activeView, activeParam);
}
document.querySelectorAll(".lang-opt").forEach(b=>{
  b.onclick = ()=> setLang(b.dataset.lang);
});

function getViewGroupColor(viewId){
  let color = GROUP_COLORS.ng_overview;
  for(const item of NAV){
    if(item.group) color = GROUP_COLORS[item.group] || color;

      <div style="font-size:12.8px;color:var(--ink-2);line-height:1.7">${t('ai_principle_body')}</div>
    </div>
  `);
  cols.appendChild(problems); cols.appendChild(aiPrinciple);
  wrap.appendChild(cols);

  function permCard(titleKey, itemsKey){
    const items = tl(itemsKey);
    return `
      <div class="perm-card th">
        <h4>${t(titleKey)}</h4>
        <ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul>
      </div>
    `;
  }
  wrap.appendChild(el(`
    <div class="section">
      <div class="section-title" style="margin-bottom:10px">${t('user_roles_title')}</div>
      <div class="role-perm-grid">
        ${permCard('perm_owner_title','perm_owner_items')}
        ${permCard('perm_designer_title','perm_designer_items')}
        ${permCard('perm_consultant_title','perm_consultant_items')}
        ${permCard('perm_contractor_title','perm_contractor_items')}
      </div>
    </div>
  `));

  function protoCard(titleKey, itemsKey, accent){
    const items = tl(itemsKey);
    return `
      <div class="card th" style="border-top:3px solid ${accent}">
        <div class="section-title" style="margin-bottom:8px">${t(titleKey)}</div>
        <ul style="margin:0;padding-left:18px;font-size:12.3px;color:var(--ink-2);line-height:1.9">${items.map(i=>`<li>${i}</li>`).join("")}</ul>
      </div>
    `;
  }
  wrap.appendChild(el(`
    <div class="section">
      <div class="section-title" style="margin-bottom:10px">${t('proto_vs_prod_title')}</div>
      <div class="about-cols">
        ${protoCard('proto_shows_title','proto_shows_items','var(--green)')}
        ${protoCard('proto_next_title','proto_next_items','var(--amber)')}
      </div>
    </div>
  `));

  wrap.appendChild(el(`
    <div class="section">
      <div class="section-title" style="margin-bottom:10px">${t('about_prototype_title')}</div>
      <div class="credit-box">
        <div class="credit-row"><span>${t('prepared_by')}</span><b class="th">นายวีระ วงษ์สันต์ (Veera Wongson)</b></div>
        <div class="credit-row"><span>${t('student_id')}</span><b>166505232018</b></div>
        <div class="credit-row"><span>${t('section_lbl')}</span><b>CE16631E</b></div>
        <div class="credit-row"><span>${t('project_type')}</span><b>${t('project_type_val')}</b></div>
      </div>
    </div>
  `));

  return wrap;
};

/* ============================= INIT ============================= */
function startApp(){
  setLang(currentLang);
  checkMobile();
}
function checkMobile(){ document.getElementById("hamburger").style.display = window.innerWidth<=880 ? "flex" : "none"; }
window.addEventListener("resize", checkMobile);

wireLoginScreen();
</script>
